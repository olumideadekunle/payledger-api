[project]
name = "payledger-api"
version = "1.0.0"
description = "Production-grade double-entry financial ledger and wallet API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic[email]>=2.6.0,<3.0.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.28,<3.0.0",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pyjwt>=2.8.0,<3.0.0",
    "bcrypt>=4.1.2,<5.0.0",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
